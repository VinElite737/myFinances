function monthName(m){return new Date(2000,m,1).toLocaleString(settings.lang==='tr'?'tr-TR':settings.lang==='en'?'en-GB':'de-DE',{month:'short'})}
function loanCalc(l){
  const A=l.amount,n=l.term,i=l.rate/100/12,hol=new Set(l.hol||[]);
  const [sy,sm]=l.start.split("-").map(Number),m0=sm-1;
  const pays=k=>!hol.has((m0+k)%12);
  let cnt=0,sf=0;for(let k=0;k<n;k++)if(pays(k)){cnt++;sf+=Math.pow(1+i,n-1-k)}
  if(!cnt)return null;
  const P=A*Math.pow(1+i,n)/sf,total=P*cnt,now=new Date();
  const el=Math.max(0,Math.min(n,(now.getFullYear()-sy)*12+now.getMonth()-m0));
  let b=A;for(let k=0;k<el;k++){b=b*(1+i)-(pays(k)?P:0)}
  return{P,total,interest:total-A,el,left:Math.max(0,b)};
}
function loanCard(l){

function schedule(l,sp){
  const A=l.amount,n=l.term,i=l.rate/100/12,hol=new Set(l.hol||[]);
  const [sy,sm]=l.start.split("-").map(Number),m0=sm-1,P=loanCalc(l).P;
  let kS=null;if(sp){const[y2,m2]=sp.from.split("-").map(Number);kS=(y2-sy)*12+m2-1-m0}
  let b=A,rows=[],ti=0,tp=0,ts=0;
  for(let k=0;k<n&&b>0.005;k++){
    const it=b*i;let pay=hol.has((m0+k)%12)?0:P;
    if(k===n-1||pay>b+it)pay=b+it;
    let s=0;
    if(sp&&k>=kS&&(sp.mode==="m"||(sp.mode==="y"&&(k-kS)%12===0)||(sp.mode==="o"&&k===kS)))s=Math.min(sp.amt,Math.max(0,b+it-pay));
    b=b+it-pay-s;if(b<0.005)b=0;
    const d=new Date(sy,m0+k,1);
    rows.push({k,date:String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(),pay,int:it,pr:pay-it,sp:s,bal:b});
    ti+=it;tp+=pay;ts+=s;
  }
  return{rows,interest:ti,total:tp+ts,months:rows.length,end:rows.length?rows[rows.length-1].date:"",sp:ts};
}

document.getElementById("hAdd").onclick=()=>{

};

function snapshot(){return JSON.stringify({app:"myfinances",version:1,exported:new Date().toISOString(),hh:S.hh},null,2)}
function importData(txt){
  const o=JSON.parse(txt),a=Array.isArray(o)?o:o.hh;
  if(!Array.isArray(a)||!a.length)throw 0;
  const num=v=>{v=parseFloat(v);return isFinite(v)&&v>=0?v:0};
  const ne=x=>({id:uid(),name:String(x.name||"").slice(0,80),cat:CATS.concat(ICATS).includes(x.cat)?x.cat:"Sonstiges",amount:num(x.amount),freq:FREQ[x.freq]?x.freq:"m",note:String(x.note||"").slice(0,500)});
  const nh=a.map(h=>({id:uid(),name:String(h.name||"Haushalt").slice(0,80),persons:(h.persons||[]).map(p=>({id:uid(),name:String(p.name||"Person").slice(0,80),inc:(p.inc||[]).map(ne),exp:(p.exp||[]).map(ne)})),loans:(h.loans||[]).filter(l=>l&&l.amount>0&&l.term>=1&&/^\d{4}-\d{2}$/.test(l.start||"")).map(l=>({id:uid(),name:String(l.name||"Kredit").slice(0,80),amount:num(l.amount),rate:num(l.rate),eff:l.eff==null?null:num(l.eff),hol:(l.hol||[]).map(Number).filter(m=>m>=0&&m<12),note:String(l.note||"").slice(0,500),term:parseInt(l.term,10),start:l.start}))}));
  if(S.hh.length===1&&!S.hh[0].persons.length)S.hh=nh;else S.hh.push(...nh);
  S.cur=nh[0].id;
}

function dataDlg(){
  document.querySelectorAll(".menu-dropdown").forEach(d=>d.removeAttribute("open"));
  dlg.innerHTML=`<h2>${t('exportImport')}</h2>
  <label>${t('exportLabel')}</label>
  <div style="margin:0 0 10px;">
    <button id="ex">${t('downloadFileBtn')}</button>
  </div>
  <label style="margin-top:16px;">${t('importLabel')}</label>
  <div style="margin-bottom:8px;">
    <label for="fi" class="file-upload-btn">${t('selectFileBtn')}</label>
    <input type="file" id="fi" accept=".json,application/json" style="display:none">
  </div>
  <textarea id="it" placeholder="${t('importPlaceholder')}" style="margin-top:8px"></textarea>
  <div id="ms" class="tag" style="margin-top:8px;font-weight:600;color:var(--ac);"></div>
  <div class="row"><button id="cx">${t('close')}</button><button id="ok" class="p">${t('importBtn')}</button></div>`;
  dlg.showModal();
  const $=id=>document.getElementById(id),ms=msgText=>$("ms").textContent=msgText;
  const hiddenSnapshot = snapshot();
  $("cx").onclick=()=>dlg.close();
  
  $("ex").onclick=()=>{
    try {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(hiddenSnapshot);
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `myfinances-${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      ms(settings.lang==='tr' ? "Dışa aktarma dosyası başarıyla indirildi!" : settings.lang==='en' ? "Export file downloaded successfully!" : "Export-Datei wurde erfolgreich heruntergeladen!");
    } catch(x) {
      ms("Error.");
    }
  };
  
  $("fi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
    try{$("it").value=await f.text();ms(settings.lang==='tr' ? "Dosya yüklendi – şimdi 'İçe Aktar' butonuna tıklayın." : settings.lang==='en' ? "File loaded – now click 'Import'." : "Datei geladen – jetzt auf „Importieren“ klicken.")}catch(x){ms("Error reading file.")}};
  $("ok").onclick=()=>{
    try{
      const txt = $("it").value.trim();
      if(!txt) { ms(settings.lang==='tr' ? "Lütfen bir dosya seçin veya metin girin." : settings.lang==='en' ? "Please select a file or insert text." : "Bitte wählen Sie eine Datei aus oder fügen Sie Text ein."); return; }
      importData(txt);save();render();dlg.close();
    }catch(x){ms("Failed.")}
  };
}

});

function closeMenu(){document.getElementById("menu").hidden=true}
document.addEventListener("click",closeMenu,true);
function openMenu(btn,items){
  const m=document.getElementById("menu");m.innerHTML="";
  items.forEach(([l,fn,c])=>{const b=document.createElement("button");b.textContent=l;if(c)b.className=c;b.onclick=fn;m.appendChild(b)});
  m.hidden=false;
  const r=btn.getBoundingClientRect();
  m.style.top=r.bottom+4+"px";
  m.style.left=Math.max(8,Math.min(r.right-m.offsetWidth,innerWidth-m.offsetWidth-8))+"px";
}
function confirmDlg(title,msg,label,fn){
  dlg.innerHTML=`<h2>${title}</h2><p>${msg}</p><div class="row">${label?`<button id="cx">${t('cancel')}</button>`:''}<button id="ok" class="p ${label?'x':''}">${label||'OK'}</button></div>`;
  dlg.showModal();
  if(label)document.getElementById("cx").onclick=()=>dlg.close();
  document.getElementById("ok").onclick=()=>{dlg.close();if(fn){fn();save();render()}};
}

    [t('delete'),()=>{
      if(S.hh.length<2)return confirmDlg("Nicht möglich","Der letzte Haushalt kann nicht gelöscht werden.");

    },"d"]
  ]);
};

document.getElementById("app").onclick=ev=>{
  const b=ev.target.closest("button[data-a]");if(!b)return;
  const h=H(),p=h.persons.find(q=>q.id===b.dataset.p),tName=b.dataset.t,a=b.dataset.a;
  if(a==="tgl"){S.ui=S.ui||{};S.ui[b.dataset.s]=S.ui[b.dataset.s]===false;save();render();return}
  if(a==="lAdd")return loanDlg();
  if(a==="lMenu"){const l=h.loans.find(y=>y.id===b.dataset.l);return openMenu(b,[
