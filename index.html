} catch(e){}

function t(key) {
  const dict = I18N[settings.lang] || I18N.de;
  return dict[key] || I18N.de[key] || key;
}

function applyTheme(theme) {
  settings.theme = theme;
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e){}
  if (theme === 'system') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
}

let uid=()=>Math.random().toString(36).slice(2,9);
function blank(){return{cur:null,hh:[{id:uid(),name:"Mein Haushalt",persons:[]}]}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}
if(!S||!S.hh||!S.hh.length)S=blank();
if(!S.cur||!S.hh.find(h=>h.id===S.cur))S.cur=S.hh[0].id;
S.trash=S.trash||[];
function trashAdd(o){S.trash.unshift({id:uid(),at:Date.now(),...o});S.trash=S.trash.slice(0,200)}
function trashRestore(id){const e=S.trash.find(z=>z.id===id);if(!e)return false;const h=S.hh.find(x=>x.id===e.hh);if(!h)return false;
  if(e.kind==="loan"){(h.loans=h.loans||[]).push(e.item)}else{const p=h.persons.find(q=>q.id===e.p);if(!p)return false;p[e.tn].push(e.item)}
  S.trash=S.trash.filter(z=>z!==e);save();render();return true}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
const H=()=>S.hh.find(h=>h.id===S.cur);
const mo=x=>x.amount/FREQ[x.freq][1];
const sum=l=>l.reduce((a,x)=>a+mo(x),0);
const eur=n=>n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dlg=document.getElementById("dlg");

  document.getElementById("lblData").textContent = t('exportImport');

function render(){
  updateStaticTexts();
  const currentH = H();
  document.getElementById("hhCurrentName").textContent = currentH ? currentH.name : t('selectLang');
  document.getElementById("hhPanel").innerHTML = S.hh.map(h => `<button data-id="${h.id}">${esc(h.name)}</button>`).join("");
  if(view==="netto"){renderNetto();return}
  
  const h=H();h.loans=h.loans||[];S.ui=S.ui||{};const ui={persons:S.ui.persons!==false,loans:S.ui.loans!==false};
  const inc=h.persons.reduce((a,p)=>a+sum(p.inc),0),exp=h.persons.reduce((a,p)=>a+sum(p.exp),0),bal=inc-exp;
  const cats={};h.persons.forEach(p=>p.exp.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+mo(x)));
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=cl.length?cl[0][1]:1;
  let o=`<div class="grid kpis">

   <div class="card kpi"><small>${t('availableBudget')}</small><b class="${bal<0?"out":"in"}">${eur(bal)}</b></div>
   <div class="card kpi"><small>${t('expenseYear')}</small><b>${eur(exp*12)}</b></div></div>
   <div class="grid ov"><div class="card"><div class="ph"><h2>${t('overviewPerson')}</h2></div>
   <table><tr><th>${t('person')}</th><th class="n">${t('income')}</th><th class="n">${t('expense')}</th><th class="n">${t('balance')}</th></tr>
   ${h.persons.map(p=>{const i=sum(p.inc),a=sum(p.exp);return`<tr><td>${esc(p.name)}</td><td class="n in">${eur(i)}</td><td class="n out">${eur(a)}</td><td class="n">${eur(i-a)}</td></tr>`}).join("")||`<tr><td colspan="4" class="empty">${t('noPersons')}</td></tr>`}
   </table></div>
   <div class="card"><div class="ph"><h2>${t('expenseCat')}</h2></div>
   ${cl.map(([c,v])=>`<div class="bar"><span>${esc(c)}</span><span><i style="width:${v/mx*100}%"></i></span><span>${eur(v)}</span></div>`).join("")||`<div class="empty">${t('noExpenses')}</div>`}</div></div>
   <div class="fold"><button class="fold-t ${ui.persons?'':'closed'}" data-a="tgl" data-s="persons"><span class="chev">▼</span>${t('personsHeader')}</button><button class="p" data-a="pAdd">${t('addPerson')}</button></div>`;
  if(ui.persons){o+=`<div class="grid ov">`;

   list(p,"inc",t('income'))+list(p,"exp",t('expense'))+`<div class="sum" style="background:var(--${sum(p.inc)-sum(p.exp)<0?"outb":"inb"})"><span>${t('saldoMonth')}</span><span>${eur(sum(p.inc)-sum(p.exp))}</span></div></div>`});
  o+=`</div>`}
  o+=`<div class="fold"><button class="fold-t ${ui.loans?'':'closed'}" data-a="tgl" data-s="loans"><span class="chev">▼</span>${t('loansHeader')}</button><button class="p" data-a="lAdd">${t('addLoan')}</button></div>`;
  if(ui.loans){o+=`<div class="grid ov">`+(h.loans.map(loanCard).join("")||`<div class="card"><div class="empty">${t('noLoans')}</div></div>`)+`</div>`}

}
function list(p,tName,title){
  const l=p[tName],c=tName==="inc"?"in":"out";
  const freqName = k => {
    if(k==='m') return t('freqMonthly');
    if(k==='q') return t('freqQuarterly');
    return t('freqYearly');
  };
  return`<div class="sec"><b>${title} <span class="${c}">${eur(sum(l))}</span></b><button class="s" data-a="eAdd" data-p="${p.id}" data-t="${tName}">${t('add')}</button></div>`+
  (l.length?`<table>${l.map(x=>`<tr><td>${esc(x.name)}<div class="tag">${esc(x.cat)} · ${freqName(x.freq)}</div>${x.note?`<div class="note-v">${esc(x.note)}</div>`:""}</td>
  <td class="a ${c}">${eur(x.amount)}${x.freq!=="m"?`<div class="tag">${eur(mo(x))}/Mon.</div>`:""}</td>
  <td class="a"><button class="s k" data-a="eMenu" data-p="${p.id}" data-t="${tName}" data-i="${x.id}" aria-label="Menü">⋯</button></td></tr>`).join("")}</table>`:`<div class="empty">${t('noEntries')}</div>`);
}
function monthName(m){return new Date(2000,m,1).toLocaleString(settings.lang==='tr'?'tr-TR':settings.lang==='en'?'en-GB':'de-DE',{month:'short'})}
function isoD(d){return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function parseD(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
function addDaysS(s,n){const p=parseD(s);if(!p)return"";return isoD(new Date(Date.UTC(p.y,p.m-1,p.d+n)))}
function addMonthsS(s,n){const p=parseD(s);if(!p)return"";const last=new Date(Date.UTC(p.y,p.m-1+n+1,0)).getUTCDate();return isoD(new Date(Date.UTC(p.y,p.m-1+n,Math.min(p.d,last))))}
function diffDaysS(a,b){const x=parseD(a),y=parseD(b);if(!x||!y)return 0;return Math.round((Date.UTC(y.y,y.m-1,y.d)-Date.UTC(x.y,x.m-1,x.d))/864e5)}
function fmtD(s){const p=parseD(s);return p?String(p.d).padStart(2,"0")+"."+String(p.m).padStart(2,"0")+"."+p.y:""}

function easterT(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,L=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*L)/451),n=h+L-7*m+114;return Date.UTC(y,Math.floor(n/31)-1,n%31+1)}
function bankHol(t){const d=new Date(t),m=d.getUTCMonth()+1,x=d.getUTCDate();if((m===1&&x===1)||(m===5&&x===1)||(m===12&&(x===25||x===26)))return true;const e=easterT(d.getUTCFullYear());return t===e-2*864e5||t===e+864e5}
function bizDay(y,m0,d){let t=Date.UTC(y,m0,d);for(;;){const w=new Date(t).getUTCDay();if(w===0||w===6||bankHol(t))t+=864e5;else break}return isoD(new Date(t))}
function d360(a,b){const x=parseD(a),y=parseD(b);if(!x||!y)return 0;return(y.y-x.y)*360+(y.m-x.m)*30+(Math.min(y.d,30)-Math.min(x.d,30))}
/* Bank-Logik: Rate fällig am 1. des Monats (Wochenende/Feiertag -> nächster Bankarbeitstag), Zinsen 30/360 auf tatsächliche Zahltermine,
   Karenzzinsen (Auszahlung -> 1. Rate) stecken in der 1. Rate, Rate = aufgerundet auf Cent, letzte Rate = Restschuld + Zinsen. */
function loanPlan(l,sp){
  const A=l.amount,r=l.rate/100,i=r/12,hol=new Set(l.hol||[]),[sy,sm]=l.start.split("-").map(Number);
  let N=l.term;if(l.payout){const p=parseD(l.payout);N=(p.y*12+p.m-1)+l.term-(sy*12+sm-1)+1}
  if(!(N>=1))return null;
  const due=k=>{const d=new Date(Date.UTC(sy,sm-1+k,1));return bizDay(d.getUTCFullYear(),d.getUTCMonth(),1)};
  const d0=due(0),p0=l.payout||addMonthsS(sy+"-"+pad2(sm)+"-01",-1),g=d360(p0,d0);
  const pays=k=>!hol.has((sm-1+k)%12);
  let cnt=0,sf=0;for(let k=0;k<N;k++)if(pays(k)){cnt++;sf+=Math.pow(1+i,N-1-k)}
  if(!cnt)return null;
  const calculatedP=Math.ceil(A*(1+r*g/360)*Math.pow(1+i,N-1)/sf*100-1e-7)/100;
  const P=Number(l.payment)>0?rnd(Number(l.payment)):calculatedP;
  let kS=null;if(sp){const[y2,m2]=sp.from.split("-").map(Number);kS=(y2-sy)*12+m2-sm}
  let b=A,prev=p0,rows=[],ti=0,tp=0,ts=0;
  for(let k=0;k<N&&b>0.005;k++){
    const d=due(k),it=rnd(b*r*d360(prev,d)/360);prev=d;
    let pay=pays(k)?P:0;if(k===N-1||pay>rnd(b+it))pay=rnd(b+it);
    let s=0;
    if(sp&&k>=kS&&(sp.mode==="m"||(sp.mode==="y"&&(k-kS)%12===0)||(sp.mode==="o"&&k===kS)))s=Math.min(sp.amt,Math.max(0,rnd(b+it-pay)));
    b=rnd(b+it-pay-s);if(b<0.005)b=0;
    rows.push({k,d,date:fmtD(d),pay,int:it,pr:rnd(pay-it),sp:s,bal:b});ti+=it;tp+=pay;ts+=s;
  }
  return{rows,P,N,g,p0,interest:rnd(ti),total:rnd(tp+ts),months:rows.length,end:rows.length?rows[rows.length-1].date:"",sp:ts};
}
const schedule=loanPlan;
function graceInt(l){if(!l.payout)return 0;const s=loanPlan(l,null);return s?s.rows[0].int:0}
function loanCalc(l){
  const s=loanPlan(l,null);if(!s)return null;
  const n=new Date(),today=n.getFullYear()+"-"+pad2(n.getMonth()+1)+"-"+pad2(n.getDate());

/* --- Steuertarif (§ 32a EStG) --- */
function nlTarif(x,Y){x=Math.floor(x);if(x<=Y.gf)return 0;let t;
  if(x<=Y.tz[0]){const y=(x-Y.gf)/1e4;t=(Y.a[0]*y+Y.a[1])*y}
  else if(x<=Y.tz[1]){const z=(x-Y.tz[0])/1e4;t=(Y.b[0]*z+Y.b[1])*z+Y.b[2]}
  else if(x<=Y.tz[2])t=Y.c[0]*x-Y.c[1];else t=Y.d[0]*x-Y.d[1];
  return Math.floor(t)}
function nlTarif56raw(x,Y){return Math.max((nlTarif(x*1.25,Y)-nlTarif(x*.75,Y))*2,x*.14)}
function nlTarif56(x,Y){x=Math.floor(x);const W2=34939,W3=222260;
  if(x>W2){let st=nlTarif56raw(W2,Y);st+=x>W3?(W3-W2)*.42+(x-W3)*.45:(x-W2)*.42;return Math.floor(st)}
  return Math.floor(nlTarif56raw(x,Y))}

    std:e?+s.std:40,gehaelter:e?+s.gehaelter:12}}

/* --- Berechnung (monatlich, Arbeitnehmer-Sicht) --- */
function nlCalc(I,g){
  const Y=NL_Y[I.year];
  const bavTax=Math.min(I.bav,.08*Y.bbgRV/12),bavSv=Math.min(I.bav,.04*Y.bbgRV/12);
  const taxM=Math.max(0,g+I.gwv-bavTax),svM=Math.max(0,g+I.gwv-bavSv);
  const mini=I.ueberg&&svM<=Y.mG,mid=I.ueberg&&svM>Y.mG&&svM<=2000;
  const G=Y.mG,F=Math.round(.28/((Y.rvR+Y.avR+14.6+Y.zus+Y.pvR)/100)*1e4)/1e4;
  const BE=mid?F*G+(2000/(2000-G)-G/(2000-G)*F)*(svM-G):svM;
  const bRV=Math.min(svM,Y.bbgRV/12),bKV=Math.min(svM,Y.bbgKV/12);
  const an=(anR,agR,base)=>{if(mini||anR<=0)return 0;if(mid)return((anR+agR)*BE-agR*svM)/100;return anR*base/100};
  const sv=(opt,rate)=>an((opt==="voll"||opt==="nurAN")?rate/2:0,(opt==="voll"||opt==="nurAG")?rate/2:0,bRV);
  const rv=sv(I.rv,Y.rvR),av=sv(I.av,Y.avR);
  let kv=0,pv=0;
  if(I.kv==="pkv"){const zu=I.pkvag?Math.min(I.pkv/2,(7.3+Y.zus/2)/100*Y.bbgKV/12):0;kv=Math.max(0,I.pkv-zu)}
  else{
    const r=I.kvr/2+I.zus/2;kv=an(r,r,bKV);
    const sax=I.land==="Sachsen";let pvAN=sax?2.3:1.8;const pvAG=sax?1.3:1.8;
    if(I.kids===0&&I.age>=23)pvAN+=.6;else if(I.kids>=2)pvAN-=.25*Math.min(I.kids-1,4);
    pv=an(pvAN,pvAG,bKV);
  }
  const ka=(I.kammer&&(I.land==="Bremen"||I.land==="Saarland")&&!mini)?.0015*bKV:0;
  /* Lohnsteuer: Jahreshochrechnung */
  /* Vorsorgepauschale (PAP 2026): RV voll, KV ohne Krankengeld-Anteil (0,6 %-Pkt.), PV – ohne ALV */
  const kvTax=(I.kv==="pkv"||!(I.kvr/2+I.zus/2))?kv:kv*(((I.kvr-.6)/2+I.zus/2)/(I.kvr/2+I.zus/2));
  const vsp=12*(rv+kvTax+pv);
  const zve=Math.max(0,Math.floor(taxM*12-1230-36-vsp-I.freib-(I.sk==="2"?4260:0)));
  const Y5=I.sk==="5"||I.sk==="6";
  let lst,base;
  if(Y5){lst=nlTarif56(zve,Y);base=lst}
  else{
    const f=z=>I.sk==="3"?2*nlTarif(Math.floor(z/2),Y):nlTarif(z,Y);
    lst=f(zve);base=f(Math.max(0,zve-I.kfb*Y.kfb));
    if(I.sk==="4F"){lst*=I.faktor;base*=I.faktor}
  }
  lst=Math.floor(lst);
  const fg=Y.soliFG*(I.sk==="3"?2:1);
  const soli=base<=fg?0:Math.floor(Math.min(base*.055,(base-fg)*.119)*100)/100;
  const kist=I.kist?Math.floor(base*((I.land==="Bayern"||I.land==="Baden-Württemberg")?.08:.09)*100)/100:0;
  const o={g,gwv:I.gwv,bav:I.bav,lst:lst/12,soli:soli/12,kist:kist/12,ka,kv,pv,rv,av,mini,mid,svM};
  o.abz=o.lst+o.soli+o.kist+ka+kv+pv+rv+av;
  o.net=g-I.bav-o.abz;
  return o;
}

  kids:"Kinder unter 25 Jahren wirken sich auf den Pflegeversicherungsbeitrag aus (Abschlag ab dem 2. Kind).",
  kfb:"Der Kinderfreibetrag steht auf der Lohnsteuerkarte (0,5 pro Elternteil und Kind). Er wirkt sich auf Solidaritätszuschlag und Kirchensteuer aus.",
  rv:"Beschäftigte sind in der Regel rentenversicherungspflichtig. Bei Sonderfällen (z. B. nur Arbeitgeberanteil) können Sie das hier anpassen.",
  av:"Der Beitrag zur Arbeitslosenversicherung beträgt 2,6 % und wird je zur Hälfte von Arbeitnehmer und Arbeitgeber getragen.",
  gehaelter:"13. und 14. Gehalt sind Einmalzahlungen. Das Ergebnis zeigt immer die Werte für 12 Monatsgehälter."
};

/* --- Formular --- */
const nlOpts=(arr,cur)=>arr.map(([v,l])=>`<option value="${v}"${String(cur)===String(v)?" selected":""}>${l}</option>`).join("");
const nlSel=(k,arr)=>`<select id="nl_${k}" data-nl="${k}">${nlOpts(arr,NL[k])}</select>`;
const nlSeg=(k,arr)=>`<div class="nl-seg" role="radiogroup">${arr.map(([v,l])=>`<label><input type="radio" name="nl_${k}" data-nl="${k}" value="${v}">${l}</label>`).join("")}</div>`;
const nlInp=(k,unit,ph)=>`<div class="nl-inp"><input id="nl_${k}" type="text" inputmode="decimal" data-nl="${k}" value="${esc(NL[k])}" placeholder="${ph||""}" autocomplete="off">${unit?`<span>${unit}</span>`:""}</div>`;
const nlRange=(a,b,st,suf)=>{const r=[];for(let v=a;v<=b+1e-9;v+=st)r.push([String(v),String(v).replace(".",",")+(suf||"")]);return r};
function nlRow(id,label,ctrl,o){o=o||{};const inp=o.inp;
  return`<div class="nl-row" data-row="${id}"${o.ext?' data-ext="1"':""}><${inp?`label for="nl_${inp}"`:'div'} class="nl-lab">${label}${NL_INFO[id]?`<button type="button" class="nl-i" data-info="${id}" aria-label="Info zu ${esc(label.replace(/<[^>]+>/g,""))}">i</button>`:""}</${inp?"label":"div"}><div>${ctrl}</div>${NL_INFO[id]?`<div class="nl-hint" data-hint="${id}" hidden>${esc(NL_INFO[id])}</div>`:""}</div>`}
const NL_JN=[["j","Ja"],["n","Nein"]];

function nlFormHTML(){
  const kassen=`<select id="nl_kasse" data-nl="kasse"><option value="">Krankenkasse wählen …</option>${NL_KASSEN.map(([n,z],i)=>`<option value="${i}"${String(NL.kasse)===String(i)?" selected":""}>${n} (${String(z).replace(".",",")} %)</option>`).join("")}</select>`;
  return[
    nlRow("amount",`Ihr <span id="nlAmtLab">Bruttolohn</span> *`,`<div style="display:grid;gap:8px">${nlSeg("mode",[["brutto","Bruttolohn"],["netto","Wunschnettolohn"]])}${nlInp("amount","€","z. B. 3.500")}</div>`,{inp:"amount"}),
    nlRow("ueberg","Übergangsbereich berücksichtigen?",nlSeg("ueberg",NL_JN),{ext:1}),
    nlRow("per","Abrechnungszeitraum",nlSeg("per",[["m","Monat"],["y","Jahr"]])),
    nlRow("bav","betriebliche Altersvorsorge",nlInp("bav","€/mtl.","0"),{ext:1,inp:"bav"}),
    nlRow("gwv","Geldwerter Vorteil",nlInp("gwv","€/mtl.","0"),{ext:1,inp:"gwv"}),
    nlRow("freib","Jährl. Steuerfreibetrag",nlInp("freib","€","0"),{ext:1,inp:"freib"}),
    nlRow("sk","Ihre Steuerklasse *",nlSel("sk",[["1","Klasse 1"],["2","Klasse 2"],["3","Klasse 3"],["4","Klasse 4"],["4F","Klasse 4 mit Faktor"],["5","Klasse 5"],["6","Klasse 6"]]),{inp:"sk"}),
    nlRow("faktor","Faktor auf der LohnSt.-Karte",nlInp("faktor","","z. B. 0,85"),{inp:"faktor"}),
    nlRow("kist","Zahlen Sie Kirchensteuer",nlSeg("kist",NL_JN)),
    nlRow("land","Ihr Bundesland *",nlSel("land",NL_LAENDER.map(l=>[l,l])),{inp:"land"}),
    nlRow("kammer","Arbeitskammerbeitrag",nlSeg("kammer",NL_JN),{ext:1}),
    nlRow("kv","Krankenversicherung",nlSel("kv",[["gkv","gesetzlich pflichtversichert"],["pkv","privat versichert"],["frei","freiwillig gesetzlich versichert"]]),{inp:"kv"}),
    nlRow("kvr","Krankenversicherungssatz",nlInp("kvr","%","14,6"),{ext:1,inp:"kvr"}),
    nlRow("zus","Krankenversicherungszusatzbeitrag",`<div class="nl-two">${nlInp("zus","%","2,9")}${kassen}</div>`,{inp:"zus"}),
    nlRow("pkv","monatl. Prämie zur PKV",nlInp("pkv","€","z. B. 450"),{inp:"pkv"}),
    nlRow("pkvag","Arbeitgeber-Beteiligung an PKV?",nlSeg("pkvag",NL_JN)),
    nlRow("haveKids","Haben Sie Kinder?",nlSeg("haveKids",NL_JN)),
    nlRow("kids","Kinder bis 25 Jahre",nlSel("kids",nlRange(0,6,1)),{ext:1,inp:"kids"}),
    nlRow("kfb","Ihr Kinderfreibetrag",nlSel("kfb",nlRange(0,6,.5)),{ext:1,inp:"kfb"}),
    nlRow("age","Ihr Alter",nlSel("age",nlRange(17,77,1," Jahre")),{ext:1,inp:"age"}),
    nlRow("rv","Rentenversicherung",nlSel("rv",[["nein","nicht gesetzlich pflichtversichert"],["voll","gesetzlich pflichtversichert"],["nurAG","nur Arbeitgeber-Pflichtanteil"],["nurAN","nur Arbeitnehmer-Pflichtanteil"]]),{ext:1,inp:"rv"}),
    nlRow("av","Arbeitslosenversicherung",nlSel("av",[["nein","nicht gesetzlich pflichtversichert"],["voll","gesetzlich pflichtversichert"],["nurAG","nur Arbeitgeber-Pflichtanteil"],["nurAN","nur Arbeitnehmer-Pflichtanteil"]]),{ext:1,inp:"av"}),
    nlRow("std","Wöchentliche Arbeitsstunden",nlSel("std",[...nlRange(15,30,1),...nlRange(30.5,46,.5)]),{ext:1,inp:"std"}),
    nlRow("gehaelter","Anzahl Gehälter pro Jahr",nlSel("gehaelter",[["12","12"],["13","13"],["14","14"]]),{ext:1,inp:"gehaelter"})
  ].join("");
}

const NL_VIS={
  faktor:()=>NL.sk==="4F",
  kammer:()=>NL.land==="Bremen"||NL.land==="Saarland",
  kvr:()=>NL.kv!=="pkv",zus:()=>NL.kv!=="pkv",
  pkv:()=>NL.kv==="pkv",pkvag:()=>NL.kv==="pkv"
};
function nlVis(){
  document.querySelectorAll("#nlRoot .nl-row").forEach(r=>{
    const id=r.dataset.row;
    r.hidden=(r.dataset.ext&&!NL.ext)||(NL_VIS[id]&&!NL_VIS[id]());
  });
  const l=document.getElementById("nlAmtLab");if(l)l.textContent=NL.mode==="netto"?"Wunschnettolohn":"Bruttolohn";
  const b=document.getElementById("nlExtBtn");if(b)b.textContent=NL.ext?"Standard Formular":"Erweitertes Formular";
}
function nlGet(k){return k==="haveKids"?(NL.kids>0?"j":"n"):NL[k]}
function nlSync(){
  document.querySelectorAll("#nlRoot [data-nl]").forEach(el=>{
    const v=String(nlGet(el.dataset.nl));
    if(el.type==="radio")el.checked=el.value===v;
    else if(el.tagName==="SELECT"||el!==document.activeElement)el.value=v;
  });
}
function nlAutoKfb(){if(!NL.kfbManual){const per={"1":.5,"2":1,"3":1,"4":.5,"4F":.5}[NL.sk]||0;NL.kfb=Math.min(6,NL.kids*per)}}
function nlOnChange(ev){
  const el=ev.target.closest("[data-nl]");if(!el)return;
  const text=el.tagName==="INPUT"&&el.type==="text";
  if(ev.type==="input"&&!text)return;
  if(ev.type==="change"&&text)return nlAfter(false);
  if(el.type==="radio"&&!el.checked)return;
  const k=el.dataset.nl,v=el.value;
  if(k==="haveKids"){NL.kids=v==="j"?Math.max(1,+NL.kids):0;NL.kfbManual=false;nlAutoKfb()}
  else if(k==="kids"){NL.kids=+v;NL.kfbManual=false;nlAutoKfb()}
  else if(k==="kfb"){NL.kfb=+v;NL.kfbManual=true}
  else if(k==="sk"){NL.sk=v;nlAutoKfb()}
  else if(k==="year"){NL.year=v;if(!NL.zusManual)NL.zus=String(NL_Y[v].zus).replace(".",",")}
  else if(k==="zus"){NL.zus=v;NL.zusManual=true;NL.kasse=""}
  else if(k==="kasse"){NL.kasse=v;if(v!==""){NL.zus=String(NL_KASSEN[+v][1]).replace(".",",");NL.zusManual=true}}
  else NL[k]=v;
  nlAfter(!text);
}
function nlAfter(sync){if(sync)nlSync();nlVis();nlSave();if(NL.calced)nlCompute()}

/* --- Ergebnis --- */
function nlCompute(scroll){
  const out=document.getElementById("nlResult");if(!out)return;
  const I=nlEff(),a=nlNum(NL.amount),err=[];
  if(!(a>0))err.push("Bitte geben Sie einen Betrag ein.");
  if(I.sk==="4F"&&!(I.faktor>0&&I.faktor<1))err.push("Bitte geben Sie einen Faktor zwischen 0 und 1 ein (z. B. 0,85).");
  if(I.kv==="pkv"&&!(I.pkv>0))err.push("Bitte geben Sie die monatliche PKV-Prämie ein.");
  if(err.length){out.innerHTML=`<div class="card nl-res"><div class="nl-err">${err.map(esc).join("<br>")}</div></div>`;return}
  NL.calced=true;
  const m=NL.per==="y"?a/12:a;
  const g=NL.mode==="netto"?nlSolve(I,m):m;
  out.innerHTML=nlResultHTML(nlCalc(I,g),I);
  if(scroll)out.scrollIntoView({behavior:"smooth",block:"start"});
}
function nlResultHTML(R,I){
  const Y=NL_Y[I.year],y=v=>v*12,c=v=>eur(Math.round(v*100)/100);
  const tr=(lab,v,cls)=>`<tr class="${cls||""}"><td>${lab}</td><td class="n ${cls==="neg"?"out":""}">${cls==="neg"?"− ":""}${c(v)}</td><td class="n ${cls==="neg"?"out":""}">${cls==="neg"?"− ":""}${c(y(v))}</td></tr>`;
  const steuer=R.lst+R.soli+R.kist,kvpv=R.kv+R.pv,rvav=R.rv+R.av;
  const tot=R.net+steuer+R.ka+kvpv+rvav||1;
  const seg=[["Netto",R.net,"var(--ac2)"],["Steuern",steuer,"var(--out)"],["Kranken-/Pflegeversicherung",kvpv+R.ka,"var(--ac)"],["Renten-/Arbeitslosenvers.",rvav,"#a78bfa"]];
  const hours=I.std*52/12,rate=R.g/hours;
  let notes="";
  if(R.mini)notes+=`<div class="nl-note">Bis ${eur(Y.mG)} Monatsverdienst fallen für Arbeitnehmer keine Sozialabgaben an (Minijob).</div>`;
  else if(R.mid)notes+=`<div class="nl-note">Es wurde der Übergangsbereich (reduzierte Sozialabgaben) berücksichtigt.</div>`;
  if(I.kv==="gkv"&&R.g*12>Y.jaeg)notes+=`<div class="nl-note">Ihr Jahresbrutto liegt über der Versicherungspflichtgrenze von ${eur(Y.jaeg)}. Ein Wechsel in die private Krankenversicherung wäre grundsätzlich möglich.</div>`;
  if(NL.ext&&I.gehaelter>12)notes+=`<div class="nl-note">Jahresbrutto bei ${I.gehaelter} Gehältern: ${c(R.g*I.gehaelter)} – die Berechnung zeigt Werte für 12 Monatsgehälter.</div>`;
  return`<div class="nl-res">
  <div class="grid kpis">
    <div class="card kpi"><small>Nettolohn / Monat</small><b class="in">${c(R.net)}</b></div>
    <div class="card kpi"><small>Nettolohn / Jahr</small><b>${c(y(R.net))}</b></div>
    <div class="card kpi"><small>${NL.mode==="netto"?"Benötigter Bruttolohn / Monat":"Bruttolohn / Monat"}</small><b>${c(R.g)}</b></div>
    <div class="card kpi"><small>Abzüge gesamt</small><b class="out">${c(R.abz)}</b><div class="tag" style="margin-top:4px">${nlPct(R.abz/(R.g||1))} vom Brutto</div></div>
  </div>
  <div class="card">
    <div class="ph"><h2>Ihre Gehaltsabrechnung ${I.year}</h2></div>
    <div class="nl-stack">${seg.map(([n,v,col])=>`<i title="${n}" style="width:${Math.max(0,v/tot*100)}%;background:${col}"></i>`).join("")}</div>
    <div class="nl-leg">${seg.map(([n,v,col])=>`<span style="--c:${col}">${n} ${nlPct(v/tot)}</span>`).join("")}</div>
    <div style="overflow-x:auto"><table>
      <tr><th></th><th class="n">Monatlich</th><th class="n">Jährlich</th></tr>
      ${tr("Bruttolohn",R.g)}
      ${R.gwv>0?tr("+ Geldwerter Vorteil",R.gwv):""}
      ${R.bav>0?tr("Entgeltumwandlung (bAV)",R.bav,"neg"):""}
      ${tr("Lohnsteuer",R.lst,"neg")}${tr("Solidaritätszuschlag",R.soli,"neg")}${tr("Kirchensteuer",R.kist,"neg")}
      ${R.ka>0?tr("Arbeitskammerbeitrag",R.ka,"neg"):""}
      ${tr("Krankenversicherung",R.kv,"neg")}${I.kv==="pkv"?"":tr("Pflegeversicherung",R.pv,"neg")}
      ${tr("Rentenversicherung",R.rv,"neg")}${tr("Arbeitslosenversicherung",R.av,"neg")}
      ${R.gwv>0?tr("Geldwerter Vorteil (nicht ausgezahlt)",R.gwv,"neg"):""}
      ${tr("Nettolohn (Auszahlung)",R.net,"tot")}
    </table></div>
    <div class="nl-note">Brutto-Stundenlohn bei ${String(I.std).replace(".",",")} Wochenstunden: ca. ${c(rate)}</div>
    ${notes}
    <div class="nl-note">Näherungsrechnung auf Basis der Steuer- und Sozialversicherungswerte ${I.year}. Sie ersetzt keine offizielle Lohnabrechnung; im Einzelfall kann das Ergebnis um wenige Euro abweichen.</div>
  </div></div>`;
}

/* --- Seite --- */
function renderNetto(){
  document.getElementById("app").innerHTML=`<div id="nlRoot">
  <div class="nl-top"><button id="nlBack" type="button">${t('nettoBack')}</button></div>
  <div class="card nl-head" style="margin-bottom:14px"><h2>Gehaltsrechner</h2><p>Hier können Sie Ihren Nettolohn <b>kostenlos</b> berechnen!</p></div>
  <div class="card nl-form">${nlFormHTML()}
    <div class="nl-act"><button id="nlCalc" class="p" type="button">Berechnen</button><button id="nlExtBtn" class="nl-link" type="button"></button></div>
  </div>
  <div id="nlResult" aria-live="polite"></div>
  <div class="card nl-info"><div class="ph"><h2>Informationen zum Gehaltsrechner</h2></div>
    <details><summary>Steuerklassen</summary><p>${esc(NL_INFO.sk)}</p></details>
    <details><summary>Krankenversicherung &amp; Zusatzbeitrag</summary><p>Der allgemeine Beitragssatz liegt bei 14,6 % und wird zwischen Arbeitnehmer und Arbeitgeber geteilt. Zusätzlich erhebt jede Kasse einen eigenen Zusatzbeitrag (2026 im Durchschnitt 2,9 %), den ebenfalls beide Seiten je zur Hälfte tragen. Beiträge werden nur bis zur Beitragsbemessungsgrenze fällig (2026: 5.812,50 € monatlich).</p></details>
    <details><summary>Pflegeversicherung</summary><p>Der Beitragssatz beträgt 3,6 %. Kinderlose ab 23 Jahren zahlen zusätzlich 0,6 Prozentpunkte allein. Ab dem zweiten Kind unter 25 Jahren sinkt der Arbeitnehmeranteil um 0,25 Prozentpunkte je Kind (bis zum fünften Kind). In Sachsen ist der Arbeitnehmeranteil höher.</p></details>
    <details><summary>Rentenversicherung &amp; Arbeitslosenversicherung</summary><p>Die Beiträge betragen 18,6 % (Rente) und 2,6 % (Arbeitslosenversicherung), jeweils hälftig. Die Beitragsbemessungsgrenze liegt 2026 bei 8.450 € monatlich.</p></details>
    <details><summary>Kinderfreibetrag</summary><p>${esc(NL_INFO.kfb)} Für 2026 beträgt er 9.756 € je Kind (beide Elternteile zusammen).</p></details>
    <details><summary>Anzahl Gehälter</summary><p>${esc(NL_INFO.gehaelter)}</p></details>
    <details><summary>Änderungen 2026</summary><p>Grundfreibetrag 12.348 € (vorher 12.096 €), Kinderfreibetrag 9.756 € (vorher 9.600 €), Kindergeld 259 € je Kind und ein durchschnittlicher Zusatzbeitrag von 2,9 %.</p></details>
  </div></div>`;
  const root=document.getElementById("nlRoot");
  root.addEventListener("input",nlOnChange);root.addEventListener("change",nlOnChange);
  root.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.matches("input[type=text]")){ev.preventDefault();nlCompute(true)}});
  root.addEventListener("click",ev=>{
    const i=ev.target.closest("[data-info]");
    if(i){const h=root.querySelector(`[data-hint="${i.dataset.info}"]`);if(h){h.hidden=!h.hidden;i.classList.toggle("on",!h.hidden)}return}
    if(ev.target.closest("#nlCalc"))return nlCompute(true);
    if(ev.target.closest("#nlExtBtn")){NL.ext=!NL.ext;nlVis();nlSave();if(NL.calced)nlCompute();return}
    if(ev.target.closest("#nlBack")){view="home";NL.calced=false;render();window.scrollTo({top:0})}
  });
  nlSync();nlVis();
}
document.getElementById("hNetto").onclick=()=>{
  document.querySelectorAll(".menu-dropdown").forEach(d=>d.removeAttribute("open"));
  view="netto";NL.calced=false;render();window.scrollTo({top:0});
};

render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
