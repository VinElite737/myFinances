<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<meta name="description" content="Dein modernes Haushaltsbuch für Einnahmen, Ausgaben und Budget.">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>myFinances</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#0ea5e9;--ac2:#10b981;--in:#059669;--out:#e11d48;--inb:#ecfdf5;--outb:#fff1f2;--shadow:0 4px 20px -2px rgba(15,23,42,.05);box-sizing:border-box;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f8fafc;--mu:#94a3b8;--bd:#334155;--ac:#38bdf8;--ac2:#34d399;--in:#34d399;--out:#fb7185;--inb:#064e3b;--outb:#4c0519;--shadow:0 4px 20px -2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f8fafc;--mu:#94a3b8;--bd:#334155;--ac:#38bdf8;--ac2:#34d399;--in:#34d399;--out:#fb7185;--inb:#064e3b;--outb:#4c0519;--shadow:0 4px 20px -2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:20px}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}main{max-width:1180px;margin:0 auto;padding:28px 22px 48px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 20px;margin-bottom:24px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:210px}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 12px rgba(14,165,233,.25)}h1{font-size:21px;line-height:1.2;letter-spacing:-.5px;margin:0}.brand-sub{font-size:12px;color:var(--mu);margin-top:3px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}select,input,button{font:inherit;color:var(--tx)}select,input{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;outline:none}select:focus,input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(14,165,233,.15)}button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}button:hover{border-color:var(--ac);transform:translateY(-1px)}button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;font-weight:600}button.d{color:var(--out)}button.s{padding:4px 9px;font-size:13px}.toolbar select{width:auto;min-width:170px;max-width:230px}.menu-dropdown{position:relative}.menu-dropdown summary{list-style:none;cursor:pointer;user-select:none;border:1px solid var(--bd);border-radius:10px;padding:9px 13px;background:var(--card);font-weight:600}.menu-dropdown summary::-webkit-details-marker{display:none}.dropdown-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:40;min-width:190px;padding:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--shadow);display:grid;gap:4px}.dropdown-panel button{width:100%;text-align:left;border:0;background:transparent;transform:none}.dropdown-panel button:hover{background:var(--bg)}
#app>.grid{margin-bottom:14px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}.kpi{position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;right:-22px;top:-25px;width:90px;height:90px;border-radius:50%;background:var(--ac);opacity:.06}.kpi small{color:var(--mu);display:block;font-size:13px;margin-bottom:9px}.kpi b{font-size:clamp(21px,2.5vw,27px);letter-spacing:-.7px;overflow-wrap:anywhere}.in{color:var(--in)}.out{color:var(--out)}.ov{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));margin-bottom:16px}.bar{display:grid;grid-template-columns:105px minmax(30px,1fr) 90px;gap:10px;align-items:center;margin:12px 0;font-size:13px}.bar i{display:block;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2));min-width:2px}.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}.ph{display:flex;align-items:center;gap:8px;margin-bottom:14px}.ph h2{margin-right:auto;font-size:16px;letter-spacing:-.2px}.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 5px}.sec b{font-size:13px}.sum{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:10px;margin-top:14px;font-weight:650}.empty{color:var(--mu);font-size:13px;padding:10px 0}table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:600;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:7px 6px}td{padding:10px 6px;border-top:1px solid var(--bd)}td.n,th.n{text-align:right;white-space:nowrap}td.a{text-align:right;white-space:nowrap}.tag{font-size:11px;color:var(--mu)}.k{font-weight:700;letter-spacing:1px;padding:3px 9px}textarea{width:100%;min-height:80px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}#menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:5px;min-width:160px;box-shadow:var(--shadow)}#menu[hidden]{display:none}#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px}#menu button:hover{background:var(--bg)}button.x{background:var(--out);border-color:var(--out);color:#fff}dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:22px;box-shadow:var(--shadow)}dialog::backdrop{background:rgba(15,23,42,.4);backdrop-filter:blur(3px)}dialog h2{font-size:18px;margin:0}dialog p{margin:10px 0 0;color:var(--mu)}label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:13px 0 5px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
@media(max-width:640px){main{padding:12px 10px 28px}header{padding:14px;border-radius:15px;gap:12px}.brand{width:100%;margin-right:0}.toolbar{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto}.toolbar select{width:100%;max-width:none;min-width:0}.menu-dropdown{justify-self:end}.dropdown-panel{right:0}.card{padding:14px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi b{font-size:20px}.ov{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:90px minmax(20px,1fr) 80px;gap:7px}.ph h2{font-size:15px}table{font-size:12px}td{padding:8px 4px}th{padding:5px 4px}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">
    <div class="brand-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </div>
    <div><h1>myFinances</h1><div class="brand-sub">Deine Finanzen im Überblick</div></div>
  </div>
  <div class="toolbar">
    <select id="hh" aria-label="Haushalt auswählen"></select>
    <details class="menu-dropdown"><summary>Menü</summary><div class="dropdown-panel">
      <button id="hAdd">＋ Neuer Haushalt</button>
      <button id="hData">⇅ Export / Import</button>
      <button id="hMenu">⚙ Haushalt verwalten</button>
    </div></details>
  </div>
</header>
<div id="app"></div>
</main>
<dialog id="dlg"></dialog>
<div id="menu" hidden></div>

<script>
const CATS=["Wohnen","Kredite","Versicherungen","Entertainment","Sparen","Gesundheit","Lebensmittel","Mobilität","Sonstiges"];
const ICATS=["Gehalt","Nebenverdienst","Sonstiges"];
const FREQ={m:["monatlich",1],q:["vierteljährlich",3],y:["jährlich",12]};
const KEY="myfinances-v1";
let uid=()=>Math.random().toString(36).slice(2,9);
function blank(){return{cur:null,hh:[{id:uid(),name:"Mein Haushalt",persons:[]}]}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}
if(!S||!S.hh||!S.hh.length)S=blank();
if(!S.cur||!S.hh.find(h=>h.id===S.cur))S.cur=S.hh[0].id;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
const H=()=>S.hh.find(h=>h.id===S.cur);
const mo=x=>x.amount/FREQ[x.freq][1];
const sum=l=>l.reduce((a,x)=>a+mo(x),0);
const eur=n=>n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dlg=document.getElementById("dlg");

function render(){
  const sel=document.getElementById("hh");
  sel.innerHTML=S.hh.map(h=>`<option value="${h.id}"${h.id===S.cur?" selected":""}>${esc(h.name)}</option>`).join("");
  const h=H();
  const inc=h.persons.reduce((a,p)=>a+sum(p.inc),0),exp=h.persons.reduce((a,p)=>a+sum(p.exp),0),bal=inc-exp;
  const cats={};h.persons.forEach(p=>p.exp.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+mo(x)));
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=cl.length?cl[0][1]:1;
  let o=`<div class="grid kpis">
   <div class="card kpi"><small>Einnahmen / Monat</small><b class="in">${eur(inc)}</b></div>
   <div class="card kpi"><small>Ausgaben / Monat</small><b class="out">${eur(exp)}</b></div>
   <div class="card kpi"><small>Verfügbares Budget</small><b class="${bal<0?"out":"in"}">${eur(bal)}</b></div>
   <div class="card kpi"><small>Ausgaben / Jahr</small><b>${eur(exp*12)}</b></div></div>
   <div class="grid ov"><div class="card"><div class="ph"><h2>Übersicht pro Person</h2></div>
   <table><tr><th>Person</th><th class="n">Einnahmen</th><th class="n">Ausgaben</th><th class="n">Saldo</th></tr>
   ${h.persons.map(p=>{const i=sum(p.inc),a=sum(p.exp);return`<tr><td>${esc(p.name)}</td><td class="n in">${eur(i)}</td><td class="n out">${eur(a)}</td><td class="n">${eur(i-a)}</td></tr>`}).join("")||`<tr><td colspan="4" class="empty">Noch keine Personen.</td></tr>`}
   </table></div>
   <div class="card"><div class="ph"><h2>Ausgaben nach Kategorie</h2></div>
   ${cl.map(([c,v])=>`<div class="bar"><span>${esc(c)}</span><span><i style="width:${v/mx*100}%"></i></span><span>${eur(v)}</span></div>`).join("")||`<div class="empty">Keine Ausgaben.</div>`}</div></div>
   <div class="ph" style="margin-top:20px"><h2 style="font-size:18px">Personen</h2><button class="p" data-a="pAdd">+ Person</button></div><div class="grid ov">`;
  h.persons.forEach(p=>{o+=`<div class="card"><div class="ph"><h2>${esc(p.name)}</h2><button class="s k" data-a="pMenu" data-p="${p.id}" aria-label="Menü">⋯</button></div>`+
   list(p,"inc","Einnahmen")+list(p,"exp","Ausgaben")+`<div class="sum" style="background:var(--${sum(p.inc)-sum(p.exp)<0?"outb":"inb"})"><span>Saldo / Monat</span><span>${eur(sum(p.inc)-sum(p.exp))}</span></div></div>`});
  document.getElementById("app").innerHTML=o+"</div>";
}
function list(p,t,title){
  const l=p[t],c=t==="inc"?"in":"out";
  return`<div class="sec"><b>${title} <span class="${c}">${eur(sum(l))}</span></b><button class="s" data-a="eAdd" data-p="${p.id}" data-t="${t}">+ Hinzufügen</button></div>`+
  (l.length?`<table>${l.map(x=>`<tr><td>${esc(x.name)}<div class="tag">${esc(x.cat)} · ${FREQ[x.freq][0]}</div></td>
  <td class="a ${c}">${eur(x.amount)}${x.freq!=="m"?`<div class="tag">${eur(mo(x))}/Mon.</div>`:""}</td>
  <td class="a"><button class="s k" data-a="eMenu" data-p="${p.id}" data-t="${t}" data-i="${x.id}" aria-label="Menü">⋯</button></td></tr>`).join("")}</table>`:`<div class="empty">Noch keine Einträge.</div>`);
}
function ask(html,ok){
  dlg.innerHTML=html+`<div class="row"><button id="cx">Abbrechen</button><button id="ok" class="p">Speichern</button></div>`;
  dlg.showModal();
  document.getElementById("cx").onclick=()=>dlg.close();
  document.getElementById("ok").onclick=()=>{if(ok()!==false){dlg.close();save();render()}};
  const f=dlg.querySelector("input");if(f)f.focus();
}
function nameDlg(title,val,cb){
  ask(`<h2>${title}</h2><label>Name</label><input id="nm" value="${esc(val)}">`,()=>{const v=document.getElementById("nm").value.trim();if(!v)return false;cb(v)});
}
function entryDlg(p,t,x){
  const cats=t==="inc"?ICATS:CATS,isNew=!x;x=x||{name:"",cat:cats[0],amount:"",freq:"m"};
  ask(`<h2>${t==="inc"?"Einnahme":"Ausgabe"} ${isNew?"hinzufügen":"bearbeiten"} (${esc(p.name)})</h2>
  <label>Bezeichnung</label><input id="n" value="${esc(x.name)}">
  <label>Betrag (€)</label><input id="a" type="number" step="0.01" min="0" value="${x.amount}">
  <label>Kategorie</label><select id="c">${cats.map(c=>`<option${c===x.cat?" selected":""}>${c}</option>`).join("")}</select>
  <label>Rhythmus</label><select id="f">${Object.entries(FREQ).map(([k,v])=>`<option value="${k}"${k===x.freq?" selected":""}>${v[0]}</option>`).join("")}</select>`,()=>{
    const n=document.getElementById("n").value.trim(),a=parseFloat(document.getElementById("a").value);
    if(!n||isNaN(a)||a<0)return false;
    const d={name:n,amount:a,cat:document.getElementById("c").value,freq:document.getElementById("f").value};
    if(isNew)p[t].push({id:uid(),...d});else Object.assign(x,d);
  });
}
document.getElementById("hh").onchange=ev=>{S.cur=ev.target.value;save();render()};
document.getElementById("hAdd").onclick=()=>nameDlg("Neuer Haushalt","",v=>{const h={id:uid(),name:v,persons:[]};S.hh.push(h);S.cur=h.id});
function snapshot(){return JSON.stringify({app:"myfinances",version:1,exported:new Date().toISOString(),hh:S.hh},null,1)}
function importData(txt){
  const o=JSON.parse(txt),a=Array.isArray(o)?o:o.hh;
  if(!Array.isArray(a)||!a.length)throw 0;
  const num=v=>{v=parseFloat(v);return isFinite(v)&&v>=0?v:0};
  const ne=x=>({id:uid(),name:String(x.name||"").slice(0,80),cat:CATS.concat(ICATS).includes(x.cat)?x.cat:"Sonstiges",amount:num(x.amount),freq:FREQ[x.freq]?x.freq:"m"});
  const nh=a.map(h=>({id:uid(),name:String(h.name||"Haushalt").slice(0,80),persons:(h.persons||[]).map(p=>({id:uid(),name:String(p.name||"Person").slice(0,80),inc:(p.inc||[]).map(ne),exp:(p.exp||[]).map(ne)}))}));
  if(S.hh.length===1&&!S.hh[0].persons.length)S.hh=nh;else S.hh.push(...nh);
  S.cur=nh[0].id;
}
function dataDlg(){
  dlg.innerHTML=`<h2>Export / Import</h2>
  <label>Export (Sicherung aller Haushalte)</label>
  <div class="row" style="margin:0 0 6px;justify-content:flex-start"><button id="ex" class="p">Als Datei speichern</button><button id="cp">Text kopieren</button></div>
  <textarea id="et" readonly></textarea>
  <label>Import</label><input type="file" id="fi" accept=".json,application/json">
  <textarea id="it" placeholder="…oder gesicherten Text hier einfügen" style="margin-top:8px"></textarea>
  <div id="ms" class="tag" style="margin-top:8px"></div>
  <div class="row"><button id="cx">Schließen</button><button id="ok" class="p">Importieren</button></div>`;
  dlg.showModal();
  const $=id=>document.getElementById(id),ms=t=>$("ms").textContent=t;
  $("et").value=snapshot();
  $("cx").onclick=()=>dlg.close();
  $("ex").onclick=async()=>{
    try{const d=window.claude&&await claude.use("downloads");
      if(d){await d.save({filename:"myfinances-"+new Date().toISOString().slice(0,10)+".json",data:$("et").value});ms("Datei gespeichert.");return}
    }catch(x){if(x&&x.code==="declined"){ms("Abgebrochen.");return}}
    ms("Direktes Speichern ist hier nicht möglich – bitte den Text kopieren und selbst ablegen.");
  };
  $("cp").onclick=async()=>{
    const t=$("et").value;
    try{await navigator.clipboard.writeText(t);ms("In die Zwischenablage kopiert.");return}catch(x){}
    $("et").select();let k=false;try{k=document.execCommand("copy")}catch(x){}
    ms(k?"Kopiert.":"Bitte den markierten Text manuell kopieren.");
  };
  $("fi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
    try{$("it").value=await f.text();ms("Datei geladen – jetzt auf „Importieren“ klicken.")}catch(x){ms("Datei konnte nicht gelesen werden.")}};
  $("ok").onclick=()=>{
    try{importData($("it").value);save();render();dlg.close()}catch(x){ms("Import fehlgeschlagen: Die Daten sind ungültig.")}
  };
}
document.getElementById("hData").onclick=dataDlg;
document.addEventListener("click",ev=>{
  const dropdown=document.querySelector(".menu-dropdown");
  if(!dropdown)return;
  if(!dropdown.contains(ev.target) || !ev.target.closest("summary")) dropdown.removeAttribute("open");
});
function closeMenu(){document.getElementById("menu").hidden=true}
document.addEventListener("click",closeMenu,true);
function openMenu(btn,items){
  const m=document.getElementById("menu");m.innerHTML="";
  items.forEach(([l,fn,c])=>{const b=document.createElement("button");b.textContent=l;if(c)b.className=c;b.onclick=fn;m.appendChild(b)});
  m.hidden=false;
  const r=btn.getBoundingClientRect();
  m.style.top=r.bottom+4+"px";
  m.style.left=Math.max(8,Math.min(r.right-m.offsetWidth,innerWidth-m.offsetWidth-8))+"px";
}
function confirmDlg(title,msg,label,fn){
  dlg.innerHTML=`<h2>${title}</h2><p>${msg}</p><div class="row">${label?'<button id="cx">Abbrechen</button>':''}<button id="ok" class="p ${label?'x':''}">${label||'OK'}</button></div>`;
  dlg.showModal();
  if(label)document.getElementById("cx").onclick=()=>dlg.close();
  document.getElementById("ok").onclick=()=>{dlg.close();if(fn){fn();save();render()}};
}
document.getElementById("hMenu").onclick=ev=>{ev.currentTarget.closest("details")?.removeAttribute("open");openMenu(ev.currentTarget,[
  ["Umbenennen",()=>nameDlg("Haushalt umbenennen",H().name,v=>H().name=v)],
  ["Löschen",()=>{
    if(S.hh.length<2)return confirmDlg("Nicht möglich","Der letzte Haushalt kann nicht gelöscht werden.");
    confirmDlg("Haushalt löschen?",`„${esc(H().name)}“ wird mit allen Personen und Einträgen gelöscht.`,"Löschen",()=>{S.hh=S.hh.filter(h=>h.id!==S.cur);S.cur=S.hh[0].id});
  },"d"]]);};
document.getElementById("app").onclick=ev=>{
  const b=ev.target.closest("button[data-a]");if(!b)return;
  const h=H(),p=h.persons.find(q=>q.id===b.dataset.p),t=b.dataset.t,a=b.dataset.a;
  if(a==="pAdd")nameDlg("Neue Person","",v=>h.persons.push({id:uid(),name:v,inc:[],exp:[]}));
  else if(a==="pMenu")openMenu(b,[
    ["Umbenennen",()=>nameDlg("Person umbenennen",p.name,v=>p.name=v)],
    ["Löschen",()=>confirmDlg("Person löschen?",`„${esc(p.name)}“ wird mit allen Einnahmen und Ausgaben gelöscht.`,"Löschen",()=>{h.persons=h.persons.filter(q=>q!==p)}),"d"]]);
  else if(a==="eAdd")entryDlg(p,t);
  else if(a==="eMenu"){const x=p[t].find(y=>y.id===b.dataset.i);openMenu(b,[
    ["Bearbeiten",()=>entryDlg(p,t,x)],
    ["Löschen",()=>{p[t]=p[t].filter(y=>y!==x);save();render()},"d"]])}
};
render();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Worker konnte nicht registriert werden:', err)));
}
</script>
</body>
</html>
