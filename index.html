let settings = { theme: 'system', lang: 'de' };
try {
  const saved = localStorage.getItem(SETTINGS_KEY);
  if(saved) settings = Object.is(settings, JSON.parse(saved)) || Object.assign(settings, JSON.parse(saved));
} catch(e){}

function t(key) {
  const dict = I18N[settings.lang] || I18N.de;
  return dict[key] || I18N.de[key] || key;
}

function applyTheme(theme) {
  settings.theme = theme;
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e){}
  if (theme === 'system') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
}
applyTheme(settings.theme);

let uid=()=>Math.random().toString(36).slice(2,9);
function blank(){return{cur:null,hh:[{id:uid(),name:"Mein Haushalt",persons:[]}]}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}
if(!S||!S.hh||!S.hh.length)S=blank();
if(!S.cur||!S.hh.find(h=>h.id===S.cur))S.cur=S.hh[0].id;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
const H=()=>S.hh.find(h=>h.id===S.cur);
const mo=x=>x.amount/FREQ[x.freq][1];
const sum=l=>l.reduce((a,x)=>a+mo(x),0);
const eur=n=>n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dlg=document.getElementById("dlg");

  document.getElementById("txtSub").textContent = t('sub');
  document.getElementById("menuLabelText").textContent = t('menu');
  document.getElementById("lblAdd").textContent = t('newHH');
  document.getElementById("lblData").textContent = t('exportImport');
  document.getElementById("lblSettings").textContent = t('settings');
}

function render(){
  updateStaticTexts();
  const currentH = H();
  document.getElementById("hhCurrentName").textContent = currentH ? currentH.name : t('selectLang');
  document.getElementById("hhPanel").innerHTML = S.hh.map(h => `<button data-id="${h.id}">${esc(h.name)}</button>`).join("");
  
  const h=H();
  const inc=h.persons.reduce((a,p)=>a+sum(p.inc),0),exp=h.persons.reduce((a,p)=>a+sum(p.exp),0),bal=inc-exp;
  const cats={};h.persons.forEach(p=>p.exp.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+mo(x)));
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=cl.length?cl[0][1]:1;
  let o=`<div class="grid kpis">
   <div class="card kpi"><small>${t('incomeMonth')}</small><b class="in">${eur(inc)}</b></div>
   <div class="card kpi"><small>${t('expenseMonth')}</small><b class="out">${eur(exp)}</b></div>
   <div class="card kpi"><small>${t('availableBudget')}</small><b class="${bal<0?"out":"in"}">${eur(bal)}</b></div>
   <div class="card kpi"><small>${t('expenseYear')}</small><b>${eur(exp*12)}</b></div></div>
   <div class="grid ov"><div class="card"><div class="ph"><h2>${t('overviewPerson')}</h2></div>
   <table><tr><th>${t('person')}</th><th class="n">${t('income')}</th><th class="n">${t('expense')}</th><th class="n">${t('balance')}</th></tr>
   ${h.persons.map(p=>{const i=sum(p.inc),a=sum(p.exp);return`<tr><td>${esc(p.name)}</td><td class="n in">${eur(i)}</td><td class="n out">${eur(a)}</td><td class="n">${eur(i-a)}</td></tr>`}).join("")||`<tr><td colspan="4" class="empty">${t('noPersons')}</td></tr>`}
   </table></div>
   <div class="card"><div class="ph"><h2>${t('expenseCat')}</h2></div>
   ${cl.map(([c,v])=>`<div class="bar"><span>${esc(c)}</span><span><i style="width:${v/mx*100}%"></i></span><span>${eur(v)}</span></div>`).join("")||`<div class="empty">${t('noExpenses')}</div>`}</div></div>
   <div class="ph" style="margin-top:20px"><h2 style="font-size:18px">${t('personsHeader')}</h2><button class="p" data-a="pAdd">${t('addPerson')}</button></div><div class="grid ov">`;
  h.persons.forEach(p=>{o+=`<div class="card"><div class="ph"><h2>${esc(p.name)}</h2><button class="s k" data-a="pMenu" data-p="${p.id}" aria-label="Menü">⋯</button></div>`+
   list(p,"inc",t('income'))+list(p,"exp",t('expense'))+`<div class="sum" style="background:var(--${sum(p.inc)-sum(p.exp)<0?"outb":"inb"})"><span>${t('saldoMonth')}</span><span>${eur(sum(p.inc)-sum(p.exp))}</span></div></div>`});
  document.getElementById("app").innerHTML=o+"</div>";
}
function list(p,tName,title){
  const l=p[tName],c=tName==="inc"?"in":"out";
  const freqName = k => {
    if(k==='m') return t('freqMonthly');
    if(k==='q') return t('freqQuarterly');
    return t('freqYearly');
  };
  return`<div class="sec"><b>${title} <span class="${c}">${eur(sum(l))}</span></b><button class="s" data-a="eAdd" data-p="${p.id}" data-t="${tName}">${t('add')}</button></div>`+
  (l.length?`<table>${l.map(x=>`<tr><td>${esc(x.name)}<div class="tag">${esc(x.cat)} · ${freqName(x.freq)}</div></td>
  <td class="a ${c}">${eur(x.amount)}${x.freq!=="m"?`<div class="tag">${eur(mo(x))}/Mon.</div>`:""}</td>
  <td class="a"><button class="s k" data-a="eMenu" data-p="${p.id}" data-t="${tName}" data-i="${x.id}" aria-label="Menü">⋯</button></td></tr>`).join("")}</table>`:`<div class="empty">${t('noEntries')}</div>`);
}
function ask(html,ok){
  dlg.innerHTML=html+`<div class="row"><button id="cx">${t('cancel')}</button><button id="ok" class="p">${t('save')}</button></div>`;
  dlg.showModal();
  document.getElementById("cx").onclick=()=>dlg.close();
  document.getElementById("ok").onclick=()=>{if(ok()!==false){dlg.close();save();render()}};
  const f=dlg.querySelector("input");if(f)f.focus();
}
function nameDlg(title,val,cb){
  ask(`<h2>${title}</h2><label>${t('renameTitle')}</label><input id="nm" value="${esc(val)}">`,()=>{const v=document.getElementById("nm").value.trim();if(!v)return false;cb(v)});
}
function entryDlg(p,tName,x){
  const cats=tName==="inc"?ICATS:CATS,isNew=!x;x=x||{name:"",cat:cats[0],amount:"",freq:"m"};
  const freqName = k => {
    if(k==='m') return t('freqMonthly');
    if(k==='q') return t('freqQuarterly');
    return t('freqYearly');
  };
  ask(`<h2>${tName==="inc"?t('addIncome'):t('addExpense')} ${isNew?"":""} (${esc(p.name)})</h2>
  <label>${t('nameLabel')}</label><input id="n" value="${esc(x.name)}">
  <label>${t('amountLabel')}</label><input id="a" type="number" step="0.01" min="0" value="${x.amount}">
  <label>${t('catLabel')}</label><select id="c">${cats.map(c=>`<option${c===x.cat?" selected":""}>${c}</option>`).join("")}</select>
  <label>${t('freqLabel')}</label><select id="f">${Object.keys(FREQ).map(k=>`<option value="${k}"${k===x.freq?" selected":""}>${freqName(k)}</option>`).join("")}</select>`,()=>{
    const n=document.getElementById("n").value.trim(),a=parseFloat(document.getElementById("a").value);
    if(!n||isNaN(a)||a<0)return false;
    const d={name:n,amount:a,cat:document.getElementById("c").value,freq:document.getElementById("f").value};
    if(isNew)p[tName].push({id:uid(),...d});else Object.assign(x,d);
  });
}

document.getElementById("hhPanel").onclick=ev=>{
  const b=ev.target.closest("button[data-id]");
  if(!b)return;
  S.cur=b.dataset.id;
  document.getElementById("hhDropdown").removeAttribute("open");
  save();
  render();
};

document.getElementById("hAdd").onclick=()=>{
  document.querySelectorAll(".menu-dropdown").forEach(d=>d.removeAttribute("open"));
  nameDlg(t('newHH'),"",v=>{const h={id:uid(),name:v,persons:[]};S.hh.push(h);S.cur=h.id});
};

function snapshot(){return JSON.stringify({app:"myfinances",version:1,exported:new Date().toISOString(),hh:S.hh},null,2)}
function importData(txt){
  const o=JSON.parse(txt),a=Array.isArray(o)?o:o.hh;
  if(!Array.isArray(a)||!a.length)throw 0;
  const num=v=>{v=parseFloat(v);return isFinite(v)&&v>=0?v:0};
  const ne=x=>({id:uid(),name:String(x.name||"").slice(0,80),cat:CATS.concat(ICATS).includes(x.cat)?x.cat:"Sonstiges",amount:num(x.amount),freq:FREQ[x.freq]?x.freq:"m"});
  const nh=a.map(h=>({id:uid(),name:String(h.name||"Haushalt").slice(0,80),persons:(h.persons||[]).map(p=>({id:uid(),name:String(p.name||"Person").slice(0,80),inc:(p.inc||[]).map(ne),exp:(p.exp||[]).map(ne)}))}));
  if(S.hh.length===1&&!S.hh[0].persons.length)S.hh=nh;else S.hh.push(...nh);
  S.cur=nh[0].id;
}

function dataDlg(){
  document.querySelectorAll(".menu-dropdown").forEach(d=>d.removeAttribute("open"));
  dlg.innerHTML=`<h2>${t('exportImport')}</h2>
  <label>${t('exportLabel')}</label>
  <div style="margin:0 0 10px;">
    <button id="ex">${t('downloadFileBtn')}</button>
  </div>
  <label style="margin-top:16px;">${t('importLabel')}</label>
  <div style="margin-bottom:8px;">
    <label for="fi" class="file-upload-btn">${t('selectFileBtn')}</label>
    <input type="file" id="fi" accept=".json,application/json" style="display:none">
  </div>
  <textarea id="it" placeholder="${t('importPlaceholder')}" style="margin-top:8px"></textarea>
  <div id="ms" class="tag" style="margin-top:8px;font-weight:600;color:var(--ac);"></div>
  <div class="row"><button id="cx">${t('close')}</button><button id="ok" class="p">${t('importBtn')}</button></div>`;
  dlg.showModal();
  const $=id=>document.getElementById(id),ms=msgText=>$("ms").textContent=msgText;
  const hiddenSnapshot = snapshot();
  $("cx").onclick=()=>dlg.close();
  
  $("ex").onclick=()=>{
    try {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(hiddenSnapshot);
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `myfinances-${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      ms(settings.lang==='tr' ? "Dışa aktarma dosyası başarıyla indirildi!" : settings.lang==='en' ? "Export file downloaded successfully!" : "Export-Datei wurde erfolgreich heruntergeladen!");
    } catch(x) {
      ms("Error.");
    }
  };
  
  $("fi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
    try{$("it").value=await f.text();ms(settings.lang==='tr' ? "Dosya yüklendi – şimdi 'İçe Aktar' butonuna tıklayın." : settings.lang==='en' ? "File loaded – now click 'Import'." : "Datei geladen – jetzt auf „Importieren“ klicken.")}catch(x){ms("Error reading file.")}};
  $("ok").onclick=()=>{
    try{
      const txt = $("it").value.trim();
      if(!txt) { ms(settings.lang==='tr' ? "Lütfen bir dosya seçin veya metin girin." : settings.lang==='en' ? "Please select a file or insert text." : "Bitte wählen Sie eine Datei aus oder fügen Sie Text ein."); return; }
      importData(txt);save();render();dlg.close();
    }catch(x){ms("Failed.")}
  };
}
document.getElementById("hData").onclick=dataDlg;

document.addEventListener("click",ev=>{
  document.querySelectorAll(".menu-dropdown").forEach(dropdown=>{
    if(!dropdown.contains(ev.target)) dropdown.removeAttribute("open");
  });
});

function closeMenu(){document.getElementById("menu").hidden=true}
document.addEventListener("click",closeMenu,true);
function openMenu(btn,items){
  const m=document.getElementById("menu");m.innerHTML="";
  items.forEach(([l,fn,c])=>{const b=document.createElement("button");b.textContent=l;if(c)b.className=c;b.onclick=fn;m.appendChild(b)});
  m.hidden=false;
  const r=btn.getBoundingClientRect();
  m.style.top=r.bottom+4+"px";
  m.style.left=Math.max(8,Math.min(r.right-m.offsetWidth,innerWidth-m.offsetWidth-8))+"px";
}
function confirmDlg(title,msg,label,fn){
  dlg.innerHTML=`<h2>${title}</h2><p>${msg}</p><div class="row">${label?`<button id="cx">${t('cancel')}</button>`:''}<button id="ok" class="p ${label?'x':''}">${label||'OK'}</button></div>`;
  dlg.showModal();
  if(label)document.getElementById("cx").onclick=()=>dlg.close();
  document.getElementById("ok").onclick=()=>{dlg.close();if(fn){fn();save();render()}};
}
document.getElementById("hMenu").onclick=ev=>{
  document.querySelectorAll(".menu-dropdown").forEach(d=>d.removeAttribute("open"));
  openMenu(ev.currentTarget,[
    [t('rename'),()=>nameDlg(t('renameHH'),H().name,v=>H().name=v)],
    [t('delete'),()=>{
      if(S.hh.length<2)return confirmDlg("Nicht möglich","Der letzte Haushalt kann nicht gelöscht werden.");
      confirmDlg(t('deleteHHConfirmTitle'),`„${esc(H().name)}“`,t('delete'),()=>{S.hh=S.hh.filter(h=>h.id!==S.cur);S.cur=S.hh[0].id});
    },"d"]
  ]);
};

document.getElementById("app").onclick=ev=>{
  const b=ev.target.closest("button[data-a]");if(!b)return;
  const h=H(),p=h.persons.find(q=>q.id===b.dataset.p),tName=b.dataset.t,a=b.dataset.a;
  if(a==="pAdd")nameDlg(t('addPerson'),"",v=>h.persons.persons?.push ? h.persons.push({id:uid(),name:v,inc:[],exp:[]}) : h.persons.push({id:uid(),name:v,inc:[],exp:[]}));
  else if(a==="pMenu")openMenu(b,[
    [t('rename'),()=>nameDlg(t('renamePerson'),p.name,v=>p.name=v)],
    [t('delete'),()=>confirmDlg(t('deletePersonConfirmTitle'),`„${esc(p.name)}“`,t('delete'),()=>{h.persons=h.persons.filter(q=>q!==p)}),"d"]]);
  else if(a==="eAdd")entryDlg(p,tName);
  else if(a==="eMenu"){const x=p[tName].find(y=>y.id===b.dataset.i);openMenu(b,[
    [t('rename'),()=>entryDlg(p,tName,x)],
    [t('delete'),()=>{p[tName]=p[tName].filter(y=>y!==x);save();render()},"d"]])}
};
